name: Chrome Hearts Catalog and Discord Monitor

on:
  # 3시간마다 예약합니다. 진행 중인 감시는 종료 목표까지 실행하고 다음 감시는 대기합니다.
  schedule:
    - cron: "35 1-22/3 * * *"
  workflow_dispatch:
    inputs:
      probe_only:
        description: "chromehearts.com 접근 가능 여부만 검사하고 종료 (일반 감시 생략)"
        type: boolean
        default: false
        required: false

permissions:
  contents: write

# 예약 감시와 수동 진단이 한 사이트의 요청 예산을 동시에 소비하지 않도록 대기시킵니다.
concurrency:
  group: chwatcher-monitor
  cancel-in-progress: false

jobs:
  launch:
    # GitHub에서 제공하는 호스팅 러너만 사용합니다.
    runs-on: ubuntu-latest
    timeout-minutes: 359
    steps:
      - name: Reserve time for the final state checkpoint
        run: echo "MONITOR_STOP_EPOCH=$(( $(date +%s) + 359 * 60 - 180 ))" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --quiet -r requirements.txt

      # GitHub Actions -> Run workflow -> probe_only=true 에서만 수행.
      # HTTP 403/429가 나오면 재고 없음이 아니라 GitHub 러너에서 접근 거부된 것입니다.
      - name: Diagnose chromehearts.com access from GitHub runner
        if: ${{ inputs.probe_only == true }}
        run: python monitor.py --probe-site

      - name: Install browser when needed
        if: ${{ inputs.probe_only != true }}
        run: |
          if python -c 'import json,sys; c=json.load(open("config/monitors.json")); sys.exit(0 if any(m.get("enabled") and m.get("render", "http") in ("auto", "browser") for m in c.get("monitors", [])) else 1)'; then
            python -m playwright install --with-deps chromium
          fi

      - name: Monitor catalog and variants with adaptive pacing
        if: ${{ inputs.probe_only != true }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          # 30회 기준 × 요청 시작 간격 1.5초. 느린 응답이면 순회 간격을 늘립니다.
          SITE_REQUESTS_PER_MINUTE: "40"
          CHECK_INTERVAL_SECONDS: "45"
          SITE_BLOCK_BACKOFF_SECONDS: "900"
          # 전체 job 제한 359분에서 설치/마지막 순회/상태 저장 시간을 확보합니다.
          RUN_DURATION_SECONDS: "21000"
          GITHUB_REF_NAME: ${{ github.ref_name }}
          PYTHONUNBUFFERED: "1"
        run: exec python monitor.py --loop --git-sync
